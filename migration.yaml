apiVersion: batch/v1
kind: Job
metadata:
  name: authentication-migration-job
spec:
  template:
    spec:
      containers:
      - name: migration
        image: authenticationdbmigration:latest
        imagePullPolicy: IfNotPresent
        env:
          - name: MYSQL_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mysql-secret
                key: MYSQL_ROOT_PASSWORD
          - name: DATABASE_URL
            valueFrom:
              configMapKeyRef:
                  name: authentication-config
                  key: DATABASE_URL
          - name: JWT_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: jwt-secret
                key: JWT_SECRET_KEY
      restartPolicy: Never
  backoffLimit: 4
