apiVersion: v1
kind: ConfigMap
metadata:
  name: employee-director-config
data:
  MONGO_HOST: mongo-service
  REDIS_HOST: redis-service
  REDIS_ORDER_LIST: orders
  MONGO_PORT: "27017"
  REDIS_PORT: "6379"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: employee
  template:
    metadata:
      labels:
        app: employee
    spec:
      containers:
        - name: employee
          image: employee:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          env:
            - name: MONGO_HOST
              valueFrom:
                configMapKeyRef:
                  name: employee-director-config
                  key: MONGO_HOST
            - name: MONGO_PORT
              valueFrom:
                configMapKeyRef:
                  name: employee-director-config
                  key: MONGO_PORT
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: employee-director-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: employee-director-config
                  key: REDIS_PORT
            - name: REDIS_ORDER_LIST
              valueFrom:
                configMapKeyRef:
                  name: employee-director-config
                  key: REDIS_ORDER_LIST
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_ROOT_USERNAME
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_ROOT_PASSWORD
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: employee-service
spec:
  type: LoadBalancer
  selector:
    app: employee
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: director-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: director
  template:
    metadata:
      labels:
        app: director
    spec:
      containers:
        - name: director
          image: director:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          env:
            - name: MONGO_HOST
              valueFrom:
                configMapKeyRef:
                  name: employee-director-config
                  key: MONGO_HOST
            - name: MONGO_PORT
              valueFrom:
                configMapKeyRef:
                  name: employee-director-config
                  key: MONGO_PORT
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: employee-director-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: employee-director-config
                  key: REDIS_PORT
            - name: REDIS_ORDER_LIST
              valueFrom:
                configMapKeyRef:
                  name: employee-director-config
                  key: REDIS_ORDER_LIST
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_ROOT_USERNAME
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_ROOT_PASSWORD
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: director-service
spec:
  type: LoadBalancer
  selector:
    app: director
  ports:
    - protocol: TCP
      port: 5002
      targetPort: 5002


